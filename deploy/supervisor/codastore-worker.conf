; Keeps the background email worker running on the server.
; Copy to /etc/supervisor/conf.d/, change the paths and user, then:
;   sudo supervisorctl reread && sudo supervisorctl update && sudo supervisorctl start codastore-worker:*
; After each deploy run:  php artisan queue:restart

[program:codastore-worker]
process_name=%(program_name)s_%(process_num)02d
command=php /var/www/codastore/artisan queue:work --queue=emails,default --tries=3 --timeout=45 --sleep=3 --max-time=3600 --max-jobs=500
directory=/var/www/codastore
user=www-data
numprocs=1
autostart=true
autorestart=true
stopasgroup=true
killasgroup=true
stopwaitsecs=60
redirect_stderr=true
stdout_logfile=/var/www/codastore/storage/logs/worker.log
stdout_logfile_maxbytes=10MB
stdout_logfile_backups=3
